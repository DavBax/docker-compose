services:
  phpipam-web:
    image: index.docker.io/phpipam/phpipam-www:latest
    container_name: phpipam-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - 8080:80
    environment:
      - TZ=Europe/London
      - IPAM_DATABASE_HOST=phpipam-mariadb
      - IPAM_DATABASE_PASS=my_secret_phpipam_pass
      - IPAM_DATABASE_WEBHOST=%
    volumes:
      - /home/davepifive/DockerData/phpipam/phpipam-logo:/phpipam/css/images/logo
      - /home/davepifive/DockerData/phpipam/phpipam-ca:/usr/local/share/ca-certificates:ro
    depends_on:
      - phpipam-mariadb
    networks:
      - myNUCNetwork
  phpipam-cron:
    image: index.docker.io/phpipam/phpipam-cron:latest
    container_name: phpipam-cron
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/London
      - IPAM_DATABASE_HOST=phpipam-mariadb
      - IPAM_DATABASE_PASS=my_secret_phpipam_pass
      - SCAN_INTERVAL=1h
    volumes:
      - /home/davepifive/DockerData/phpipam/phpipam-ca:/usr/local/share/ca-certificates:ro
    depends_on:
      - phpipam-mariadb
    networks:
      - myNUCNetwork
  phpipam-mariadb:
    image: index.docker.io/mariadb:latest
    container_name: phpipam-mariadb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - MYSQL_ROOT_PASSWORD=my_secret_mysql_root_pass
    volumes:
      - /home/davepifive/DockerData/phpipam/phpipam-db-data:/var/lib/mysql
    networks:
      - myNUCNetwork
networks:
  myNUCNetwork:
    external: true

