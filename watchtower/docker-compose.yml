services:
  watchtower:
    image: index.docker.io/nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # user: '1000:1001'
    command: --interval 21600 #remove to default to 24hrs (43200=12hrs, 21600=6hrs)
    depends_on: 
      - socket-proxy-watchtower
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.watchtower.rule=Host(`watchtower.thehome.party`)"
      - "traefik.http.routers.watchtower.entrypoints=websecure"
      - "traefik.http.routers.watchtower.tls=true"
      - "traefik.http.services.watchtower.loadbalancer.server.port=8080"
      - "glance.name=Watchtower"
      - "glance.id=watchtower"
      - "glance.icon=sh:watchtower"
#      - "glance.url=https://arcane.thehome.party"
      - "glance.description=Container Updates"
    environment:
#     DOCKER_CONFIG: /home/dave/.docker/
#     DOCKER_API-VERSION: "1.45"
      TZ: "Europe/London"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_UPDATE_ON_START: "true"
      WATCHTOWER_NOTIFICATION_URL: "gotify://gotify.thehome.party/${gotify_token}"
#      WATCHTOWER_NOTIFICATION_URL: "generic://gotify.thehome.party/message?template=json&token=${gotify_token}" #used while shoutrrr was broken for gotify v3.0
      DOCKER_HOST: tcp://socket-proxy-watchtower:2375
      WATCHTOWER_HTTP_API_ENDPOINTS: containers,update,swagger
#      WATCHTOWER_HTTP_API_UPDATE: true #enables the update API endpoint
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: true #keeps the scheduled polling enabled, usually switched off by the update API endpoint
      WATCHTOWER_HTTP_API_TOKEN: ${watchtower_http_api_token}
#      WATCHTOWER_HTTP_API_CONTAINERS: true #enable <GET Containers>, used by HA
#      WATCHTOWER_NOTIFICATIONS: gotify
#      WATCHTOWER_NOTIFICATION_GOTIFY_URL: http://192.168.66.5:8090
#      WATCHTOWER_NOTIFICATION_GOTIFY_TOKEN: ${gotify_token}
#    volumes:
#      - /var/run/docker.sock:/var/run/docker.sock
#      - $HOME/.docker/config.json:/config.json #check dir of file
    networks:
      - default
      - socket-proxy-watchtower-net
      - traefik-internal

  socket-proxy-watchtower:
    image: index.docker.io/wollomatic/socket-proxy:1
    container_name: socket-proxy-watchtower
    restart: unless-stopped
    # Find your docker group's GID with: getent group docker
    user: "65534:990"
    mem_limit: 64M
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/London
    command:
      - '-loglevel=info'
      - '-listenip=0.0.0.0'
      - '-allowfrom=watchtower'
      - '-allowGET=/(v1\..{1,2}/)?(containers.*|images.*|events.*|info|version|_ping)'
      - '-allowHEAD=/(v1\..{1,2}/)?_ping'
      - '-allowPOST=/(v1\..{1,2}/)?(containers/create|containers/[^/]+/(start|stop|rename)|images/create|networks/[^/]+/connect)'
      - '-allowDELETE=/(v1\..{1,2}/)?(containers/[^/]+|images/[^/]+)'
      - '-allowhealthcheck'
      - '-watchdoginterval=3600'
      - '-stoponwatchdog'
      - '-shutdowngracetime=5'
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "glance.parent=watchtower"
      - "glance.name=Socket Proxy Watchtower"
#      - "glance.icon=sh:wollomatic"
#      - "glance.url=https://arcane.thehome.party"
      - "glance.description=Watchtower's Socket Proxy"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # read-only for file operations, but not for http operations
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 2
    networks:
      - socket-proxy-watchtower-net
    # No port published - only reachable by containers on
    # socket-proxy-watchtower-net, and even then, only "watchtower" per
    # -allowfrom above.

networks:
  socket-proxy-watchtower-net:
    driver: bridge
    ipam:
      config:
        # Confirm this /28 is actually free before deploying:
        #   docker network ls -q | xargs -n1 docker network inspect \
        #     --format '{{.Name}}: {{range .IPAM.Config}}{{.Subnet}}{{end}}'
        # 10.10.0.0/28 through 10.10.0.240/28 and 10.10.1.0/28 were taken
        # as of the read-only tier setup - this uses the next block along,
        # but re-check first in case something new has been added since.
        - subnet: 10.10.2.0/28
          gateway: 10.10.2.1
  traefik-internal:
    external: true

# needed to docker login on nuc ubuntu to add creds to config.json
# also had to add env command to provide file path, even tho that file path was mounted
# on Pi, try logging in to docker hub before starting watchtower, then see if file path works
# also try $HOME instead of dir file path
