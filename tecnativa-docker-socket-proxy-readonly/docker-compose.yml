# docker-compose-socket-proxy-readonly.yml
#
# Read-only Docker socket proxy for containers that only need to list/inspect
# containers and images (no start/stop/create/delete rights). This is the
# ONLY container that mounts the real Docker socket in this tier - everything
# else talks to it over the internal "socket-proxy-readonly-net" network.
#
# Clients in this tier: uptimekuma, dozzle, glances, portracker, beszel

services:
  socket-proxy-readonly:
    image: index.docker.io/tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy-readonly
    restart: unless-stopped
    # privileged: true   # Only needed on hosts with SELinux/AppArmor enforcing
                          # restrictions on binding the mounted docker.sock.
                          # Raspberry Pi OS usually doesn't need this - left
                          # commented out. If the container fails to start or
                          # can't bind the socket, uncomment this line.
    security_opt:
      - no-new-privileges:true
    environment:
      # --- Read access, needed by monitoring/dashboard tools ---
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - PING=1
      - VERSION=1
      - EVENTS=1
      # --- Everything else stays denied ---
      - POST=0
      - ALLOW_START=0
      - ALLOW_STOP=0
      - ALLOW_RESTARTS=0
      - AUTH=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-readonly-net
    # Do NOT publish a port to the host - only reachable by containers
    # on socket-proxy-readonly-net.

networks:
  socket-proxy-readonly-net:
    driver: bridge
