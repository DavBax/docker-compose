services:
  beszel:
    image: index.docker.io/henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment: 
      - TZ=Europe/London
#    ports:
#      - 8091:8090
    volumes:
      - /home/davepifive/DockerData/beszel/data:/beszel_data
      - /home/davepifive/DockerData/beszel/socket:/beszel_socket
    #    networks:
    #      - myNUCNetwork
    healthcheck:
      # The URL is relative to the container, not the host
      test:
        - CMD
        - /beszel
        - health
        - --url
        - http://localhost:8090
      start_period: 5s # Check 5 seconds after the container starts
      interval: 120s # Then check every 120 seconds after that
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beszel.rule=Host(`beszel.thehome.party`)"
      - "traefik.http.routers.beszel.entrypoints=websecure"
      - "traefik.http.routers.beszel.tls=true"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"
      - "glance.name=Beszel"
      - "glance.id=beszel"
      - "glance.icon=sh:beszel"
      - "glance.url=https://beszel.thehome.party"
      - "glance.description=Server Resource Metrics"
    networks:
      - default
      - traefik-internal
  
  beszel-agent:
    image: index.docker.io/henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    network_mode: host
    depends_on:
      beszel:
        condition: service_healthy
    volumes:
      - /home/davepifive/DockerData/beszel/socket:/beszel_socket
      - /home/davepifive/DockerData/beszel/agent_data:/var/lib/beszel-agent
#      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "glance.name=Beszel-Agent"
      - "glance.parent=beszel"
      - "glance.icon=sh:beszel"
#      - "glance.url=https://beszel.thehome.party"
      - "glance.description=Server Resource Metrics Agent"
    healthcheck:
      test:
        - CMD
        - /agent
        - health
        # Run the health command
      start_period: 5s # Check 5 seconds after the container starts
      interval: 120s # Then check every 120 seconds after that
    environment:
      TZ: Europe/London
      LISTEN: /beszel_socket/beszel_socket
      DOCKER_HOST: tcp://127.0.0.1:2375
      HUB_URL: https://beszel.thehome.party
      TOKEN_FILE: /run/secrets/beszel_agent_token
      KEY_FILE: /run/secrets/beszel_agent_key
    secrets:
      - beszel_agent_token
      - beszel_agent_key
networks:
  traefik-internal:
    external: true
secrets:
  beszel_agent_token:
    file: ./secrets/beszel_agent_token
  beszel_agent_key:
    file: ./secrets/beszel_agent_key