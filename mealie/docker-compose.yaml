services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.28.0
    container_name: mealie
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - /home/davepifive/DockerData/mealie/data:/app/data/
    environment:
      # Set Backend ENV Variables Here
      ALLOW_SIGNUP: false
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
      MAX_WORKERS: 1
      WEB_CONCURRENCY: 1
      BASE_URL: https://mealie.thehome.party
      OIDC_AUTH_ENABLED: 'true'
      OIDC_SIGNUP_ENABLED: 'true'
      OIDC_PROVIDER_NAME: 'Authelia'
      OIDC_CONFIGURATION_URL: 'https://sso.thehome.party/.well-known/openid-configuration'
      OIDC_CLIENT_ID: 'mealie'
      OIDC_CLIENT_SECRET_FILE: /run/secrets/mealie_oidc_client_secret
      OIDC_AUTO_REDIRECT: 'false'
      OIDC_ADMIN_GROUP: 'admins'
      OIDC_USER_GROUP: 'users'
    secrets:
      - mealie_oidc_client_secret
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-internal"
      - "traefik.http.routers.mealie.rule=Host(`mealie.thehome.party`)"
      - "traefik.http.routers.mealie.entrypoints=websecure"
      - "traefik.http.routers.mealie.tls=true"
      - "traefik.http.services.mealie.loadbalancer.server.port=9000"
      - "glance.name=Mealie"
      - "glance.icon=sh:mealie"
      - "glance.url=https://mealie.thehome.party"
      - "glance.description=Recipes"
    networks:
      - default
      - traefik-internal
secrets:
  mealie_oidc_client_secret:
    file: /home/davepifive/DockerData/mealie/secrets/mealie_oidc_client_secret
networks:
  traefik-internal:
    external: true
