services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
#    ports:
#      - 9925:9000
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - /home/davepifive/DockerData/mealie/data:/app/data/
    environment:
      # Set Backend ENV Variables Here
      ALLOW_SIGNUP: false
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
      MAX_WORKERS: 1
      WEB_CONCURRENCY: 1
      BASE_URL: https://mealie.thehome.party
      OIDC_AUTH_ENABLED: 'true'
      OIDC_SIGNUP_ENABLED: 'true'
      OIDC_PROVIDER_NAME: 'Authelia'
      OIDC_CONFIGURATION_URL: 'https://sso.thehome.party/.well-known/openid-configuration'
      OIDC_CLIENT_ID: 'mealie'
      OIDC_CLIENT_SECRET: '${client_secret}'
      OIDC_AUTO_REDIRECT: 'false'
      OIDC_ADMIN_GROUP: 'admins'
      OIDC_USER_GROUP: 'users'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mealie.rule=Host(`mealie.thehome.party`)"
      - "traefik.http.routers.mealie.entrypoints=websecure"
      - "traefik.http.routers.mealie.tls=true"
      - "traefik.http.services.mealie.loadbalancer.server.port=9000" # match Mealie's actual internal port
      - "glance.name=Mealie"
      - "glance.icon=sh:mealie"
      - "glance.url=https://mealie.thehome.party"
      - "glance.description=Recipes"
    networks:
      - default
      - traefik-internal
networks:
  traefik-internal:
    external: true