services:
  readeck:
    image: codeberg.org/readeck/readeck:0.23.6
    container_name: readeck
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    # mem_limit: 64M
    secrets:
      - readeck_oidc_client_secret
    command:
      - /bin/sh
      - -c
      - 'export READECK_AUTH_OIDC_PROVIDERS_1_CLIENT_SECRET="$$(cat /run/secrets/readeck_oidc_client_secret)"; exec /bin/readeck serve -config config.toml'
    environment:
      READECK_LOG_LEVEL: info
      READECK_SERVER_HOST: "0.0.0.0"  # The IP address on which Readeck listens.
      READECK_SERVER_PORT: 8000
      READECK_LOG_FORMAT: json
      READECK_SERVER_BASE_URL: "https://readeck.thehome.party"
      READECK_TRUSTED_PROXIES: "10.10.3.128/25"  # traefik-internal network range
      TZ: Europe/London
      READECK_ALLOWED_HOSTS: readeck.thehome.party,localhost,127.0.0.1
      READECK_AUTH_OIDC_PROVIDERS_1_NAME: Authelia
      READECK_AUTH_OIDC_PROVIDERS_1_URL: https://sso.thehome.party
      READECK_AUTH_OIDC_PROVIDERS_1_CLIENT_ID: readeck
      READECK_AUTH_OIDC_PROVIDERS_1_GROUPS: "admins=admin users=user"
    networks:
      - default
      - traefik-internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-internal
      - traefik.http.routers.readeck.rule=Host(`readeck.thehome.party`)
      - traefik.http.routers.readeck.entrypoints=websecure
      - traefik.http.routers.readeck.tls=true
      - traefik.http.services.readeck.loadbalancer.server.port=8000
      - glance.name=Readeck
      - glance.icon=sh:readeck
      - glance.url=https://readeck.thehome.party
      - glance.description=Bookmarks & Read-it-Later
    volumes:
      - /home/davepifive/DockerData/readeck/data:/readeck
    # healthcheck:
      # test: ["CMD", "/bin/readeck", "healthcheck", "-config", "config.toml"]
      # interval: 30s
      # timeout: 2s
      # retries: 3
networks:
  traefik-internal:
    external: true
secrets:
  readeck_oidc_client_secret:
    file: /home/davepifive/DockerData/readeck/secrets/readeck_oidc_client_secret
