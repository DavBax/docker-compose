services:
  glances:
    image: index.docker.io/nicolargo/glances:4.5.7
    container_name: glances
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /home/davepifive/DockerData/glances/config:/etc/glances
    environment:
      - GLANCES_OPT=-w  # web-server mode
      - TZ=Europe/London
      - DOCKER_HOST=tcp://socket-proxy-readonly-vm:2375
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:61208/api/4/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-internal"
      - "traefik.http.routers.glances.rule=Host(`glances.thehome.party`)"
      - "traefik.http.routers.glances.entrypoints=websecure"
      - "traefik.http.routers.glances.tls=true"
      - "traefik.http.services.glances.loadbalancer.server.port=61208"
      - "traefik.http.routers.glances.middlewares=authelia@docker"  # not required, nothing sensitive
      - "glance.name=Glances"
      - "glance.icon=sh:glances"
      - "glance.url=https://glances.thehome.party"
      - "glance.description=System Peformance & Metrics"
    networks:
      - default
      - traefik-internal
      - wollomatic-socket-proxy-readonly_socket-proxy-readonly-wm-net
networks:
  wollomatic-socket-proxy-readonly_socket-proxy-readonly-wm-net:
    driver: bridge
    external: true
  traefik-internal:
    external: true
