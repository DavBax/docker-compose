# docker-compose-socket-proxy-management.yml
#
# Third wollomatic/socket-proxy tier, scoped for Dockge and Arcane - full
# Docker management UIs, so this tier needs broad container/image/network/
# volume access. The proxy's value here isn't "read-only vs write" like the
# other two tiers - it's denying categories neither app has any legitimate
# reason to touch even as management tools: swarm, secrets, plugins, node
# operations, sessions, auth config.
#
# UNVERIFIED ON PURPOSE: unlike the read-only and watchtower tiers, there's
# no documented, predictable call sequence to build this allowlist from.
# Deploy this in debug mode with a broad temporary allowlist FIRST, use
# both apps normally for a few days (browsing, restarting containers,
# editing stacks, whatever you'd normally do), then narrow the regexes
# below to match what actually showed up in the logs. Don't flip to
# -loglevel=info with a tightened allowlist until that observation period
# is done.

services:
  socket-proxy-management:
    image: index.docker.io/wollomatic/socket-proxy:1
    container_name: socket-proxy-management
    restart: unless-stopped
    # Find your docker group's GID with: getent group docker
    user: "65534:990"
    mem_limit: 64M
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      # --- START HERE: broad allowlist for the observation period ---
      - '-loglevel=debug'
      - '-listenip=0.0.0.0'
      - '-allowfrom=dockge,arcane'
      - '-allowGET=/(v1\..{1,2}/)?(containers.*|images.*|networks.*|volumes.*|events.*|distribution.*|info|version|_ping)'
      - '-allowHEAD=/(v1\..{1,2}/)?_ping'
      - '-allowPOST=/(v1\..{1,2}/)?(containers.*|images.*|networks.*|volumes.*)'
      - '-allowDELETE=/(v1\..{1,2}/)?(containers.*|images.*|networks.*|volumes.*)'
      - '-allowPUT=/(v1\..{1,2}/)?containers/[^/]+/archive'
      - '-allowhealthcheck'
      - '-watchdoginterval=3600'
      - '-stoponwatchdog'
      - '-shutdowngracetime=5'
      # --- Explicitly NOT allowed, regardless of the above patterns: ---
      # auth, secrets, swarm, nodes, services, tasks, configs, plugins,
      # session, system (prune/df), distribution, commit, build, exec -
      # none of these have an -allow flag set, so they're denied by
      # wollomatic's default-deny behaviour. Do not add a flag for any of
      # these unless you've confirmed via the debug logs that Dockge or
      # Arcane genuinely needs it, and understand what granting it means.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 2
    networks:
      - socket-proxy-management-net
    # No port published - only reachable by containers on
    # socket-proxy-management-net, and even then, only "dockge"/"arcane"
    # per -allowfrom above.

networks:
  socket-proxy-management-net:
    driver: bridge
    ipam:
      config:
        # Confirm this /28 is actually free before deploying:
        #   docker network ls -q | xargs -n1 docker network inspect \
        #     --format '{{.Name}}: {{range .IPAM.Config}}{{.Subnet}}{{end}}'
        # 10.10.0.0/28-10.10.0.240/28, 10.10.1.0/28 (readonly), and
        # 10.10.2.0/28 (watchtower) were taken as of prior tiers - this
        # uses the next block along, but re-check first.
        - subnet: 10.10.3.0/28
          gateway: 10.10.3.1
