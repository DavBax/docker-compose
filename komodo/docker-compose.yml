################################
#    KOMODO COMPOSE - MONGO    #
################################

## This compose file will deploy:
##   1. MongoDB
##   2. Komodo Core
##   3. Komodo Periphery

services:
  komodo-mongodb:
    image: index.docker.io/mongo:8 #likely to change to explicit hash, if renovate works.
    container_name: komodo-mongodb
    restart: unless-stopped
#    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    command: --quiet --wiredTigerCacheSizeGB 0.25
    # ports:
    #   - 27017:27017
    environment:
      TZ: Europe/London
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
    volumes:
      - /home/davepifive/DockerData/komodo/mongodb/mongo-data:/data/db
      - /home/davepifive/DockerData/komodo/mongodb/mongo-config:/data/configdb
    labels: #no traefik labels, no webUI
      - "komodo.skip=true" # Prevent Komodo from stopping with StopAllContainers
      - "glance.parent=komodo"
      - "glance.name=Komodo MongoDB"
      - "glance.icon=sh:mongodb"
#      - "glance.url=https://arcane.thehome.party"
      - "glance.description=MongoDB for Komodo"
    networks:
      - traefik-internal
    
  komodo-core:
    image: ghcr.io/moghtech/komodo-core:2
    container_name: komodo-core
    init: true
    restart: unless-stopped
    user: "1000:1000" #may get ca-cert errors without root, see chatgpt for explaination to document
    security_opt:
      - no-new-privileges:true
    depends_on:
      - komodo-mongodb
#    ports:
#      - 9120:9120
    env_file: .env
    environment:
      KOMODO_DATABASE_ADDRESS: komodo-mongodb:27017
      KOMODO_HOST: 'https://komodo.thehome.party'
      KOMODO_OIDC_ENABLED: 'true'
      KOMODO_OIDC_PROVIDER: 'https://sso.thehome.party'
      KOMODO_OIDC_CLIENT_ID: 'komodo'
      KOMODO_OIDC_CLIENT_SECRET_FILE: /run/secrets/komodo_oidc_client_secret
    secrets:
      - komodo_oidc_client_secret
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-internal"
      - "traefik.http.routers.komodo.rule=Host(`komodo.thehome.party`)"
      - "traefik.http.routers.komodo.entrypoints=websecure"
      - "traefik.http.routers.komodo.tls=true"
      - "traefik.http.services.komodo.loadbalancer.server.port=9120"
      - "komodo.skip=true" # Prevent Komodo from stopping with StopAllContainers
      - "glance.id=komodo"
      - "glance.name=Komodo"
      - "glance.icon=sh:komodo"
#      - "glance.url=https://komodo.thehome.party"
      - "glance.description=Komodo Container Management"
    volumes:
      ## Attach the Core / Periphery communication keys
      - /home/davepifive/DockerData/komodo/keys:/config/keys
      ## Store dated backups of the database - https://komo.do/docs/setup/backup
      - /home/davepifive/DockerData/komodo/backups:/backups
      ## Store sync files on server
      - /home/davepifive/DockerData/komodo/syncs:/syncs
      ## Optionally mount a custom core.config.toml
      - /home/davepifive/DockerData/komodo/core.config.toml:/config/config.toml
      ## Optionally mount custom root CA certificate to trust
      # - /path/to/root_ca.crt:/usr/local/share/ca-certificates/root_ca.crt
    networks:
      - traefik-internal

  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2
    container_name: komodo-periphery
    init: true
    restart: unless-stopped
    user: "1000:1000" #may get ca-cert errors without root, see chatgpt for explaination to document
    security_opt:
      - no-new-privileges:true
    depends_on:
      - komodo-core
    env_file: .env
    environment:
      DOCKER_HOST: 'tcp://socket-proxy-management:2375'
    labels:
      - "komodo.skip=true" # Prevent Komodo from stopping with StopAllContainers
      - "glance.parent=komodo"
      - "glance.name=Komodo Periphery"
      - "glance.icon=sh:komodo"
#      - "glance.url=https://komodo.thehome.party"
      - "glance.description=Komodo Periphery"
    volumes:
      ## Attach the Core / Periphery communication keys
      - /home/davepifive/DockerData/komodo/keys:/config/keys
      ## Mount external docker socket
      #- /var/run/docker.sock:/var/run/docker.sock
      ## Allow Periphery to see processes outside of container
      - /proc:/proc
      ## Specify the Periphery agent root directory.
      ## All your configs / repos must be children of this directory for Periphery to be able to see it.
      ## Must be the same inside and outside the container,
      ## or docker will get confused. See https://github.com/moghtech/komodo/discussions/180.
      ## Default: /etc/komodo.
      - /home/davepifive/komodo-docker-compose:/home/davepifive/komodo-docker-compose
      ## Optionally mount a custom periphery.config.toml
      # - /path/to/periphery.config.toml:/config/config.toml
      ## Optionally mount custom root CA certificate to trust
      # - /path/to/root_ca.crt:/usr/local/share/ca-certificates/root_ca.crt
    networks:
      - traefik-internal
      - arcane_socket-proxy-management-net

networks:
  traefik-internal:
    external: true
  arcane_socket-proxy-management-net:
    external: true

secrets:
  komodo_oidc_client_secret:
    file: ./secrets/komodo_oidc_client_secret