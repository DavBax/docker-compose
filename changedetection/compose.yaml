services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.60.4
    container_name: changedetection
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /home/davepifive/DockerData/changedetection/data:/datastore
    user: "1000:1000"
    environment:
      # things removed to investigate - proxies, plugins
      - PORT=5000  # Default listening port
      - LOGGER_LEVEL=INFO  # Log output levels: TRACE, DEBUG(default), INFO, SUCCESS, WARNING, ERROR, CRITICAL
      - PLAYWRIGHT_DRIVER_URL=ws://browser-sockpuppet-chrome:3000  # to use a real Chrome browser (It uses the "playwright" protocol)
      - BASE_URL=https://changedetection.thehome.party  # Base URL of your changedetection.io install (Added to the notification alert)
      - USE_X_SETTINGS=1  # Respect proxy_pass type settings, `proxy_set_header Host "localhost";` and `proxy_set_header X-Forwarded-Prefix /app;`
      - HIDE_REFERER=true  # Hides the `Referer` header so that monitored websites can't see the changedetection.io hostname.
      - FETCH_WORKERS=10  # Default number of parallel/concurrent fetchers
      - MINIMUM_SECONDS_RECHECK_TIME=3  # Absolute minimum seconds to recheck, overrides any watch minimum, change to 0 to disable
      - ALLOW_FILE_URI=False  # If you want to watch local files file:///path/to/file.txt (careful! security implications!)
      - DISABLE_VERSION_CHECK=true  # For complete privacy if you don't want to use the 'check version' / telemetry service
      - LLM_FEATURES_DISABLED=true  # Disable all LLM / AI features, prompts etc
      - TZ=Europe/London
      - LC_ALL=en_GB.UTF-8  # Text processing locale
    depends_on:
      browser-sockpuppet-chrome:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-internal"
      - "traefik.http.routers.changedetection.rule=Host(`changedetection.thehome.party`)"
      - "traefik.http.routers.changedetection.entrypoints=websecure"
      - "traefik.http.routers.changedetection.tls=true"
      - "traefik.http.services.changedetection.loadbalancer.server.port=5000"
      # middleware required to tell changedetection that it IS being served over HTTPS, removes a /socket.io 400 error
      - "traefik.http.routers.changedetection.middlewares=changedetection-headers"
      - "traefik.http.middlewares.changedetection-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.changedetection-headers.headers.customrequestheaders.X-Forwarded-Host=changedetection.thehome.party"
      - "glance.name=ChangeDetection.io"
      - "glance.id=ChangeDetection.io"
      - "glance.icon=sh:changedetection"
      - "glance.url=https://changedetection.thehome.party"
      - "glance.description=Change Detection"
    networks:
      - default
      - traefik-internal
      - changedetection-internal

  browser-sockpuppet-chrome:
    image: index.docker.io/dgtlmoon/sockpuppetbrowser:latest
    container_name: browser-sockpuppet-chrome
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # cap_add:
    #  - SYS_ADMIN
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=10
    labels:
      - "glance.parent=ChangeDetection.io"
      - "glance.name=SockPuppet Browser"
      - "glance.icon=sh:sockpuppet"
      # - "glance.url=https://authelia.thehome.party"
      - "glance.description=Headless Browser"
    networks:
      - default
      - changedetection-internal
networks:
  traefik-internal:
    external: true
  changedetection-internal:
    driver: bridge
    internal: true
