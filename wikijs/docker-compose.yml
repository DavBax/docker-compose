services:
  wikijs_db:
    image: index.docker.io/postgres:17-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: wiki
      POSTGRES_PASSWORD: wikijsrocks
      POSTGRES_USER: wikijs
    logging:
      driver: none
    volumes:
      - /home/davepifive/DockerData/wikijs/data:/var/lib/postgresql/data
    networks:
      - myNUCNetwork
  wikijs:
    image: index.docker.io/requarks/wiki:latest
    depends_on:
      - wikijs_db
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      DB_TYPE: postgres
      DB_HOST: wikijs_db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: wikijsrocks
      DB_NAME: wiki
    ports:
      - "3000:3000"
    networks:
      - myNUCNetwork
networks:
  myNUCNetwork:
      name: myNUCNetwork
      external: true
