services:
  grafana:
    image: index.docker.io/grafana/grafana-enterprise:13.3.0
    container_name: grafana
    user: "1000:1000"
    restart: always
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512M
    environment:
      - TZ=Europe/London
      - GF_SERVER_ROOT_URL=https://grafana.thehome.party
      - GF_PLUGINS_PREINSTALL=yesoreyeram-infinity-datasource
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authelia
      - GF_AUTH_GENERIC_OAUTH_ICON=signin
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE=/run/secrets/grafana_oidc_client_secret
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email groups
      - GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES=false
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://sso.thehome.party/api/oidc/authorization
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://sso.thehome.party/api/oidc/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://sso.thehome.party/api/oidc/userinfo
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH=groups
      - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=name
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[], 'admin') && 'Admin'
      - GF_AUTH_GENERIC_OAUTH_AUTH_STYLE=InHeader
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
      - grafana_oidc_client_secret
    volumes:
      - /home/davepifive/DockerData/grafana/data:/var/lib/grafana
      - /home/davepifive/DockerData/grafana/provisioning:/etc/grafana/provisioning
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-internal"
      - "traefik.http.routers.grafana.rule=Host(`grafana.thehome.party`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      # - "traefik.http.routers.grafana.middlewares=authelia@docker"
      - "glance.name=Grafana"
      - "glance.icon=sh:grafana"
      - "glance.url=https://grafana.thehome.party"
      - "glance.description=Dashboards & alerting UI"
    networks:
      - traefik-internal
      - default  # required for plugin install, see env vars
networks:
  traefik-internal:
    external: true
secrets:
  grafana_admin_password:
    file: /home/davepifive/DockerData/grafana/secrets/grafana_admin_password
  grafana_oidc_client_secret:
    file: /home/davepifive/DockerData/grafana/secrets/grafana_oidc_client_secret
