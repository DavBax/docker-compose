services:
  grafana:
    image: index.docker.io/grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3002:3000"
    user: "0" #required for bind mounts
    volumes:
      - /home/davepifive/DockerData/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - /home/davepifive/DockerData/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - /home/davepifive/DockerData/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /home/davepifive/DockerData/grafana/data:/var/lib/grafana
#    environment:
#      GF_AUTH_ANONYMOUS_ENABLED: "true"
#      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
#      GF_AUTH_BASIC_ENABLED: "false"
#      GF_AUTH_DISABLE_LOGIN_FORM: "true"
#      GF_SERVER_PROTOCOL: https
#      GF_SERVER_DOMAIN: thehome.party
#      GF_SERVER_ROOT_URL: https://grafana.thehome.party
#      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/no_folder/loki_syslog_aio_overview.json
    networks:
      - myNUCNetwork
  prometheus:
    image: index.docker.io/prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9090:9090"
    user: "1000:1000"
    volumes:
      - /home/davepifive/DockerData/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /home/davepifive/DockerData/prometheus/data:/prometheus
      - /home/davepifive/DockerData/prometheus/config:/config
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-admin-api"
      - "--web.enable-lifecycle"
    networks:
      - myNUCNetwork
networks:
  myNUCNetwork:
    name: myNUCNetwork
    external: true
