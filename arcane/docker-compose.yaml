services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:latest
    container_name: arcane
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on: 
      - socket-proxy-management
# ports not used in traefik, only in npm
# traefik uses traefik-internal network instead
#    ports:
#      - "3552:3552"
    cgroup: host #Use the host cgroup namespace so Arcane can detect its own container ID more reliably — this matters for self-upgrades.
    environment:
      - TZ=Europe/London
      - APP_URL=https://arcane.thehome.party
      - PUID="1000"
      - PGID="1000"
      - PROJECTS_DIRECTORY=/home/davepifive/docker-compose
      - ENCRYPTION_KEY=${enc_key}
      - JWT_SECRET=${jwt}
      - DOCKER_HOST=tcp://socket-proxy-management:2375
      - OIDC_ENABLED='true'
      - OIDC_ISSUER_URL='https://sso.thehome.party'
      - OIDC_CLIENT_ID='arcane'
      - OIDC_CLIENT_SECRET=${oidc_client_secret}
      - OIDC_SCOPES='openid email profile'
      - OIDC_MERGE_ACCOUNTS='true'
    volumes:
#      - /var/run/docker.sock:/var/run/docker.sock
      - /home/davepifive/DockerData/arcane/data:/app/data
      - /home/davepifive/docker-compose:/home/davepifive/docker-compose
    healthcheck:
      test: ['CMD', '/app/arcane', 'health']
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-internal"
      - "traefik.http.routers.arcane.rule=Host(`arcane.thehome.party`)"
      - "traefik.http.routers.arcane.entrypoints=websecure"
      - "traefik.http.routers.arcane.tls=true"
      - "traefik.http.services.arcane.loadbalancer.server.port=3552" # match Mealie's actual internal port
      - "glance.name=Arcane"
      - "glance.id=arcane"
      - "glance.icon=sh:arcane"
      - "glance.url=https://arcane.thehome.party"
      - "glance.description=Container Management"
    networks:
      - default
      - traefik-internal
      - socket-proxy-management-net

  socket-proxy-management:
    image: index.docker.io/wollomatic/socket-proxy:1
    container_name: socket-proxy-management
    restart: unless-stopped
    # Find your docker group's GID with: getent group docker
    user: "65534:990"
    mem_limit: 64M
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment: 
      - TZ=Europe/London
    command:
      # --- START HERE: broad allowlist for the observation period ---
      - '-loglevel=info'
      - '-listenip=0.0.0.0'
      - '-allowfrom=arcane,komodo-periphery'
      - '-allowGET=/(v1\..{1,2}/)?(containers.*|images.*|networks.*|volumes.*|events.*|distribution.*|exec.*|info|version|_ping)'
      - '-allowHEAD=/(v1\..{1,2}/)?_ping'
      - '-allowPOST=/(v1\..{1,2}/)?(containers.*|images.*|networks.*|volumes.*|exec.*)'
      - '-allowDELETE=/(v1\..{1,2}/)?(containers.*|images.*|networks.*|volumes.*)'
      - '-allowPUT=/(v1\..{1,2}/)?containers/[^/]+/archive'
      - '-allowhealthcheck'
      - '-watchdoginterval=3600'
      - '-stoponwatchdog'
      - '-shutdowngracetime=5'
      # --- Explicitly NOT allowed, regardless of the above patterns: ---
      # auth, secrets, swarm, nodes, services, tasks, configs, plugins,
      # session, system (prune/df), distribution, commit, build, exec -
      # none of these have an -allow flag set, so they're denied by
      # wollomatic's default-deny behaviour. Do not add a flag for any of
      # these unless you've confirmed via the debug logs that Dockge or
      # Arcane genuinely needs it, and understand what granting it means.
    labels:
      - "glance.parent=arcane"
      - "glance.name=Socket Proxy Management"
#      - "glance.icon=sh:wollomatic"
#      - "glance.url=https://arcane.thehome.party"
      - "glance.description=Socket Proxy for Management"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 2
    networks:
      - socket-proxy-management-net
    # No port published - only reachable by containers on
    # socket-proxy-management-net, and even then, only "dockge"/"arcane"
    # per -allowfrom above.

networks:
  socket-proxy-management-net:
    driver: bridge
    ipam:
      config:
        # Confirm this /28 is actually free before deploying:
        #   docker network ls -q | xargs -n1 docker network inspect \
        #     --format '{{.Name}}: {{range .IPAM.Config}}{{.Subnet}}{{end}}'
        # 10.10.0.0/28-10.10.0.240/28, 10.10.1.0/28 (readonly), and
        # 10.10.2.0/28 (watchtower) were taken as of prior tiers - this
        # uses the next block along, but re-check first.
        - subnet: 10.10.3.0/28
          gateway: 10.10.3.1
  traefik-internal:
    external: true