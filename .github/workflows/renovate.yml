name: Renovate

on:
  workflow_dispatch:
   inputs:
     logLevel:
       description: 'Renovate log level'
       default: 'info'
       type: choice
       options: [info, debug]

jobs:
  renovate:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: GitHub Actions Renovate
        uses: renovatebot/github-action@v46.2.6
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: DavBax/docker-compose
          LOG_LEVEL: ${{ inputs.logLevel }}
