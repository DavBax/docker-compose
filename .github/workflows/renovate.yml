name: Renovate

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
   inputs:
     logLevel:
       description: 'Renovate log level'
       default: 'info'
       type: choice
       options: [info, debug]

jobs:
  renovate:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: GitHub Actions Renovate
        uses: renovatebot/github-action@v46.3.0
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: DavBax/docker-compose
          LOG_LEVEL: ${{ inputs.logLevel }}
      - name: Notify Gotify on failure
        if: failure()
        env:
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          curl -sf -X POST "${GOTIFY_URL}/message?token=${GOTIFY_TOKEN}" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            -F "title=Renovate run failed" \
            -F "message=DavBax/docker-compose — Renovate step failed.
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F "priority=8"
