services:
  apprise-api-swagger-ui:
    container_name: apprise-api-swagger-ui
    image: index.docker.io/swaggerapi/swagger-ui
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
#    ports:
#      - "8001:8080"
    environment:
      TZ: Europe/London
      SWAGGER_JSON: /docs/swagger.yaml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apprise-swagger.rule=Host(`apprise-swagger.thehome.party`)"
      - "traefik.http.routers.apprise-swagger.entrypoints=websecure"
      - "traefik.http.routers.apprise-swagger.tls=true"
      - "traefik.http.services.apprise-swagger.loadbalancer.server.port=8080"
#      - "traefik.http.routers.apprise-swagger.middlewares=authelia@docker"
      - "glance.name=Apprise-Swagger"
      - "glance.parent=apprise"
      - "glance.icon=sh:swagger"
      - "glance.url=https://apprise-swagger.thehome.party"
      - "glance.description=Swagger UI for Apprise"
    volumes:
      - /home/davepifive/DockerData/apprise/swagger.yaml:/docs/swagger.yaml:ro
    networks:
      - traefik-internal

  apprise:
    container_name: apprise
    image: index.docker.io/caronc/apprise:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
#    read_only: true
#    tmpfs:
#      - /tmp
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apprise.rule=Host(`apprise.thehome.party`)"
      - "traefik.http.routers.apprise.entrypoints=websecure"
      - "traefik.http.routers.apprise.tls=true"
      - "traefik.http.services.apprise.loadbalancer.server.port=8000"
      # middleware to enable CORS from swagger-ui to apprise (browser makes cross origin request, not server to server)
      - "traefik.http.middlewares.apprise-cors.headers.accesscontrolalloworiginlist=https://apprise-swagger.thehome.party"
      - "traefik.http.middlewares.apprise-cors.headers.accesscontrolallowmethods=GET,POST,OPTIONS"
      - "traefik.http.middlewares.apprise-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.apprise-cors.headers.accesscontrolmaxage=100"
      - "traefik.http.routers.apprise.middlewares=apprise-cors@docker"
#      - "traefik.http.routers.apprise.middlewares=authelia@docker"
      - "glance.name=Apprise"
      - "glance.id=apprise"
      - "glance.icon=sh:apprise"
      - "glance.url=https://apprise.thehome.party"
      - "glance.description=Notification Sender"
# To create user:password pair, it's possible to use this command:
# echo $(htpasswd -nB admin) | sed -e s/\\$/\\$\\$/g
#      - "traefik.http.middlewares.apprise-auth.basicauth.users=admin:<hash>"
#    ports:
#      - "8000:8000"
    environment:
      - TZ=Europe/London
#      - APPRISE_BASE_URL=https://apprise.thehome.party
      - APPRISE_URL=http://apprise:8000/notify
#      - APPRISE_STATELESS_URLS=gotify://gotify.thehome.party/${gotify_apprise_token}
      - APPRISE_STATEFUL_MODE=simple #Saves configs as human-readable files (/config/{KEY}.yaml)
      - APPRISE_WORKER_COUNT=1
      - APPRISE_ADMIN=y
    volumes:
      - /home/davepifive/DockerData/apprise/config:/config
      - /home/davepifive/DockerData/apprise/attach:/attach
      - /home/davepifive/DockerData/apprise/plugin:/plugin
      - /home/davepifive/DockerData/apprise/tmp:/tmp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8000/status >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
    networks:
      - traefik-internal
networks: 
  traefik-internal:
    external: true