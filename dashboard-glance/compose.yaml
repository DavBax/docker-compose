services:
  dashboard-glance:
    container_name: dashboard-glance
    image: index.docker.io/glanceapp/glance:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /home/davepifive/DockerData/dashboard-glance/config:/app/config
#    ports:
#      - 8080:8080
    user: 1000:1000
    environment: #these env vars are referenced in the glance.yml file in DockerData
      - TZ=Europe/London
      # 1. General & Domain Settings
      - HOMELAB_DOMAIN=thehome.party
      - TIMEZONE=Europe/London
      - WEATHER_LOCATION=Belfast, United Kingdom
      # 2. Docker Daemon / Proxy Access
      - DOCKER_SOCKET=tcp://socket-proxy-readonly-wm:2375
      # 3. GitHub API (Optional: Prevents rate limits on release updates)
      - GLANCE_GITHUB_TOKEN=/run/secrets/GLANCE_GITHUB_TOKEN
      # 4. OpenSky Aircraft Bounding Box Coordinates (Decimal Degrees)
      # Define a geographic square around your location
      - MY_LAT_MIN=54.40
      - MY_LAT_MAX=54.75
      - MY_LON_MIN=-6.15
      - MY_LON_MAX=-5.75
    secrets:
      - GLANCE_GITHUB_TOKEN
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-internal"
      - "traefik.http.routers.dashboard-glance.rule=Host(`dashboard.thehome.party`)"
      - "traefik.http.routers.dashboard-glance.entrypoints=websecure"
      - "traefik.http.routers.dashboard-glance.tls=true"
      - "traefik.http.services.dashboard-glance.loadbalancer.server.port=8080"
#      - "traefik.http.routers.dashboard-glance.middlewares=authelia@docker" #not required, yet
      - "glance.name=Glance"
      - "glance.icon=sh:glance"
      - "glance.url=https://dashboard.thehome.party"
      - "glance.description=Dashboard"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s
    networks:
      - default #for internet
      - traefik-internal
      - wollomatic-socket-proxy-readonly_socket-proxy-readonly-wm-net
secrets:
  GLANCE_GITHUB_TOKEN:
    file: /home/davepifive/DockerData/dashboard-glance/secrets/GLANCE_GITHUB_TOKEN
networks:
  wollomatic-socket-proxy-readonly_socket-proxy-readonly-wm-net:
    driver: bridge
    external: true
  traefik-internal:
    external: true