services:
  cloudflared:
    image: index.docker.io/cloudflare/cloudflared@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    container_name: cloudflared
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: tunnel --no-autoupdate run  # don't update voa cloudflare, watchtower will do it
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/cloudflared_tunnel_token
      - TUNNEL_METRICS=0.0.0.0:60123
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "glance.name=Cloudflared"
      - "glance.icon=sh:cloudflare"
      - "glance.description=Cloudflare Tunnel"
    secrets:
      - cloudflared_tunnel_token
    networks:
      - default
      - traefik-internal
networks:
  traefik-internal:
    external: true
secrets:
  cloudflared_tunnel_token:
    file: /home/davepifive/DockerData/cloudflared/secrets/cloudflared_tunnel_token
