services:
  ha-mcp:
    image: ghcr.io/homeassistant-ai/ha-mcp:stable
    container_name: ha-mcp
    restart: unless-stopped
    # read_only: true pairs with tmpfs: /tmp because the Python runtime writes temporary files there;
    read_only: true
    tmpfs:
      - /tmp
    # cap_drop: [ALL] drops every Linux kernel capability the container would otherwise inherit;
    cap_drop:
      - ALL
    # no-new-privileges:true blocks privilege escalation via setuid binaries.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - 8086:8086
    environment:
      - TZ=Europe/London
      - HOMEASSISTANT_URL=https://ha.thehome.party
      - HOMEASSISTANT_TOKEN=${ha_token}
    command: ha-mcp-web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ha-mcp.rule=Host(`ha-mcp.thehome.party`)"
      - "traefik.http.routers.ha-mcp.entrypoints=websecure"
      - "traefik.http.routers.ha-mcp.tls=true"
      - "traefik.http.services.ha-mcp.loadbalancer.server.port=8086"
    networks:
      - default # rewuired so ha-mcp can reach outbound to the ha server over the network
      - traefik-internal
networks:
  traefik-internal:
    external: true
